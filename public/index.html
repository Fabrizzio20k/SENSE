<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasp · Panel local</title>
<style>
  :root { color-scheme:dark; --ink:#eceeea; --muted:#a5aaa5; --line:#333834; --panel:#171a18; --base:#0e100f } * { box-sizing:border-box } body { margin:0; font:15px/1.45 system-ui,sans-serif; color:var(--ink); background:var(--base) } main { max-width:1100px; margin:auto; padding:28px 18px 56px } header { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:18px } h1,h2,p { margin:0 } h1 { font-size:21px } h2 { font-size:16px; margin-bottom:14px } .sub { color:var(--muted) } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:12px; margin:12px 0 24px } .card { background:var(--panel); border:1px solid var(--line); padding:16px } .metric { font-size:30px; font-variant-numeric:tabular-nums } .status { min-height:25px; white-space:pre-wrap; overflow-wrap:anywhere } .loading::before { content:""; display:inline-block; width:10px; height:10px; border:2px solid #777; border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px } .ready { color:#d5e8d5 } .error { color:#ffb9b0 } @keyframes spin { to { transform:rotate(360deg) } } section { margin-top:24px } button,input { font:inherit; border:1px solid #555; border-radius:3px; padding:9px 11px } button { cursor:pointer; background:#eceeea; color:#111 } button:disabled,input:disabled { opacity:.45; cursor:not-allowed } input { flex:1; min-width:0; color:var(--ink); background:#111 } .chat { padding:0; overflow:hidden } .conversation { min-height:420px; max-height:580px; overflow:auto; display:flex; flex-direction:column; gap:12px; padding:18px } .message { padding:10px 12px; max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; background:#252925; border-radius:4px } .message.me { align-self:flex-end; background:#dedfdb; color:#141514 } .photo-message { max-width:85%; width:480px; background:#090a09; border-radius:4px } .photo-message img { display:block; width:100%; max-height:400px; object-fit:contain } .composer { border-top:1px solid var(--line); padding:12px } .controls,.input-row { display:flex; flex-wrap:wrap; gap:8px } .input-row { flex-wrap:nowrap } .icon { padding:8px 10px; font-size:18px; line-height:1 } .photo-actions { display:none; margin-bottom:8px } .photo-actions.visible { display:flex } pre { max-height:260px; overflow:auto; color:#cbd0cb; font-size:12px; white-space:pre-wrap } @media(max-width:520px) { main { padding:18px 12px } header { display:block } .conversation { min-height:370px } .message,.photo-message { max-width:100% } }
</style>
<main>
  <header><div><h1>Rasp / administración local</h1><p class="sub">Flujo en tiempo real · <span id="connection">conectando</span></p></div><span class="sub">:5000</span></header>
  <h2>Sistema</h2><div class="grid"><article class="card"><p class="sub">CPU</p><p class="metric" id="cpu">—</p></article><article class="card"><p class="sub">Memoria</p><p class="metric" id="memory">—</p><p class="sub" id="memory-detail"></p></article></div>
  <h2>Sensores MQTT</h2><div class="grid"><article class="card"><p class="sub">SHT40</p><p class="metric" id="sht">Sin datos</p></article><article class="card"><p class="sub">ENS160</p><p class="metric" id="ens">Sin datos</p></article><article class="card"><p class="sub">Presencia</p><p class="metric" id="presence">Sin datos</p></article></div>
  <h2>Preparación</h2><div class="grid" id="phases"></div>
  <section><h2>Sandbox</h2><article class="card chat"><div class="conversation" id="conversation"><p class="sub" id="sandbox-note">El sandbox se habilitará al terminar la preparación.</p></div><div class="composer"><div class="controls photo-actions" id="photo-actions"><button id="count">Contar personas</button><button id="ask-photo">Preguntar sobre esta foto</button></div><div class="input-row"><button class="icon" id="take-photo" aria-label="Tomar foto" title="Tomar foto">📷</button><input id="question" placeholder="Escribe un mensaje" aria-label="Pregunta para Gemma"><button id="send">Enviar</button></div><p class="status" id="operation-status"></p></div></article></section>
  <section><h2>Telemetría recibida</h2><pre id="raw">Esperando MQTT…</pre></section>
</main>
<script>
  const $=id=>document.getElementById(id),phaseNames={yolo:'YOLO / NCNN',text:'Gemma texto',vision:'Gemma imagen'};let captureKey='',shown={},photoPending=false;
  const say=(text,mine=false)=>{const message=document.createElement('p');message.className='message'+(mine?' me':'');message.textContent=text;$('conversation').append(message);$('conversation').scrollTop=$('conversation').scrollHeight};
  const sayPhoto=()=>{const photo=document.createElement('div'),image=document.createElement('img');photo.className='photo-message';image.src='/api/capture?t='+Date.now();image.alt='Foto tomada con la cámara';photo.append(image);$('conversation').append(photo);$('conversation').scrollTop=$('conversation').scrollHeight};
  const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
  const send=async()=>{const question=$('question').value.trim();if(!question)return;say(question,true);$('question').value='';await post('/api/chat',{question})};
  $('take-photo').onclick=()=>{photoPending=true;$('question').disabled=true;post('/api/capture')};$('count').onclick=()=>post('/api/yolo');$('ask-photo').onclick=()=>{$('question').disabled=false;$('question').focus()};$('send').onclick=send;$('question').onkeydown=e=>{if(e.key==='Enter')send()};
  new EventSource('/events').onmessage=event=>{const d=JSON.parse(event.data),t=d.telemetry||{},e=t.environment||{},p=t.presence||{},active=d.sandbox.busy,ready=d.sandbox.ready;$('connection').textContent='en línea';$('cpu').textContent=d.system.cpu_percent+'%';$('memory').textContent=d.system.memory_percent+'%';$('memory-detail').textContent=d.system.memory_used_mb+' MB en uso';$('sht').textContent=e.sht40?e.sht40.temperature_c+' °C · '+e.sht40.humidity_percent+'%':'Sin datos';$('ens').textContent=e.ens160?'AQI '+e.ens160.aqi+' · '+e.ens160.eco2_ppm+' ppm':'Sin datos';$('presence').textContent=p.state||'Sin datos';$('raw').textContent=Object.keys(t).length?JSON.stringify(t,null,2):'Esperando MQTT…';$('phases').replaceChildren(...Object.entries(d.phases).map(([name,v])=>{const card=document.createElement('article'),title=document.createElement('h2'),detail=document.createElement('p');card.className='card';title.textContent=phaseNames[name];detail.className='status '+v.status;detail.textContent=v.detail;card.append(title,detail);return card}));$('sandbox-note').textContent=ready?'Toma una foto o escribe al modelo de texto.':'El sandbox se habilitará al terminar la preparación.';$('take-photo').disabled=!ready||active;$('send').disabled=!ready||active;$('count').disabled=!ready||active;$('ask-photo').disabled=!ready||active;if(!ready||active)$('question').disabled=true;const capture=d.tasks.capture;if(capture){$('operation-status').className='status '+capture.status;$('operation-status').textContent=capture.detail;if(capture.status==='error')photoPending=false;const key=capture.status+'/'+capture.seconds;if(capture.status==='ready'&&key!==captureKey){captureKey=key;sayPhoto();$('photo-actions').classList.add('visible');$('question').disabled=true;photoPending=false}}for(const name of ['yolo','chat']){const task=d.tasks[name];if(!task)continue;$('operation-status').className='status '+task.status;$('operation-status').textContent=task.status==='loading'?'Procesando…':task.detail;const key=name+'/'+task.status+'/'+task.seconds;if(task.status==='ready'&&shown[name]!==key){shown[name]=key;say((name==='yolo'?'YOLO: ':'Gemma: ')+task.detail)}}if(ready&&!active&&!d.has_capture&&!photoPending)$('question').disabled=false};
</script>
</html>
