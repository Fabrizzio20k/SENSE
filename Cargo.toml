[package]
name = "sense-people-counter"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
default-run = "sense-people-counter"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
csv = "1.4.0"
image = "0.25.10"
reqwest = { version = "0.13.5", features = ["json"] }
rumqttc = "0.25.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sysinfo = "0.38.4"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "net", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ultralytics-inference = { version = "=0.0.51", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.2.0"

[dev-dependencies]
ndarray = "0.17"
tower = { version = "0.5.3", features = ["util"] }
